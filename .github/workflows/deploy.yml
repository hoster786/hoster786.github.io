name: Deploy to GitHub Pages

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1   # avoid pulling full git history

      - name: Disk space before cleanup
        run: |
          echo "== Disk space before cleanup =="
          df -h
          echo "== Biggest folders in workspace (if any) =="
          du -xh . 2>/dev/null | sort -h | tail -20 || true

      - name: Free disk space on runner
        run: |
          echo "Removing large preinstalled tools not needed for Node build..."
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
          echo "== Disk space after cleanup =="
          df -h

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Disk usage after build
        run: |
          echo "== Disk space after build =="
          df -h
          echo "== Largest folders in repo =="
          du -xh . | sort -h | tail -30 || true
          echo "== dist size =="
          du -sh ./dist || true

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4